name: Poll ASC for build 75

on:
  workflow_dispatch:
    inputs:
      submission_id:
        required: true
        default: "70f8d2bb-4348-4afd-9f41-11b15e4f7c29"

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Poll ASC until build >= 75 or timeout
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUB_ID: ${{ inputs.submission_id }}
        run: |
          python3 -m pip install -q cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, base64
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          app_id = "6788596713"
          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_KEY_ISSUER_ID"]
          p8 = os.environ["ASC_API_KEY_P8"]
          token = os.environ.get("EXPO_TOKEN", "")
          sub_id = os.environ.get("SUB_ID", "")

          def b64url(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          def asc_token():
              now = int(time.time())
              header = b64url(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}).encode())
              payload = b64url(json.dumps({"iss": issuer, "exp": now + 1200, "aud": "appstoreconnect-v1"}).encode())
              signing = f"{header}.{payload}".encode()
              key = serialization.load_pem_private_key(p8.encode(), password=None)
              sig = key.sign(signing, ec.ECDSA(hashes.SHA256()))
              r, s = decode_dss_signature(sig)
              return f"{header}.{payload}.{b64url(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))}"

          def asc_latest():
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&fields[builds]=version,uploadedDate,processingState&sort=-uploadedDate&limit=8",
                  headers={"Authorization": f"Bearer {asc_token()}"},
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              return [{
                  "buildNumber": b["attributes"]["version"],
                  "processingState": b["attributes"]["processingState"],
                  "uploadedDate": b["attributes"]["uploadedDate"],
              } for b in data.get("data") or []]

          deadline = time.time() + 40 * 60
          while time.time() < deadline:
              builds = asc_latest()
              print("ASC", json.dumps(builds), flush=True)
              nums = [b["buildNumber"] for b in builds]
              if any(str(n).isdigit() and int(n) >= 75 for n in nums):
                  print("SUCCESS_ASC_HAS_75_PLUS", flush=True)
                  raise SystemExit(0)
              time.sleep(45)
          print("TIMEOUT still no build >= 75", flush=True)
          raise SystemExit(1)
          PY
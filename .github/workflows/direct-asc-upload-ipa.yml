name: Direct ASC upload IPA (bypass Expo)

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: GitHub run id that has code-console-ios-ipa artifact
        required: true
        default: "34175065345"

concurrency:
  group: ios-direct-asc-upload
  cancel-in-progress: true

jobs:
  upload:
    name: Upload IPA with Apple altool
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Validate secrets
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          test -n "$ASC_API_KEY_P8"
          test -n "$ASC_API_KEY_ID"
          test -n "$ASC_API_KEY_ISSUER_ID"

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist/ios private_keys
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n code-console-ios-ipa -D dist/ios
          test -f dist/ios/code-console-production.ipa
          ls -lh dist/ios/code-console-production.ipa
          python3 - <<'PY'
          import zipfile, plistlib
          z = zipfile.ZipFile("dist/ios/code-console-production.ipa")
          c = [n for n in z.namelist() if n.endswith(".app/Info.plist") and n.count("/") == 2][0]
          pl = plistlib.loads(z.read(c))
          print("CFBundleShortVersionString", pl.get("CFBundleShortVersionString"))
          print("CFBundleVersion", pl.get("CFBundleVersion"))
          print("CFBundleIdentifier", pl.get("CFBundleIdentifier"))
          PY

      - name: Materialize ASC API key for altool
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys" private_keys
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" "private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          ls -l "$HOME/.appstoreconnect/private_keys" private_keys

      - name: Upload IPA to App Store Connect via altool
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Uploading with xcrun altool..."
          xcrun altool --upload-app \
            --type ios \
            --file dist/ios/code-console-production.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_KEY_ISSUER_ID" \
            --verbose

      - name: Confirm ASC shows build >= 75
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          python3 -m pip install -q cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, base64
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          app_id="6788596713"
          key_id=os.environ["ASC_API_KEY_ID"]; issuer=os.environ["ASC_API_KEY_ISSUER_ID"]; p8=os.environ["ASC_API_KEY_P8"]
          def b64url(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          def token():
            now=int(time.time())
            h=b64url(json.dumps({"alg":"ES256","kid":key_id,"typ":"JWT"}).encode())
            p=b64url(json.dumps({"iss":issuer,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode())
            signing=f"{h}.{p}".encode()
            key=serialization.load_pem_private_key(p8.encode(), password=None)
            sig=key.sign(signing, ec.ECDSA(hashes.SHA256()))
            r,s=decode_dss_signature(sig)
            return f"{h}.{p}.{b64url(r.to_bytes(32,'big')+s.to_bytes(32,'big'))}"
          deadline=time.time()+50*60
          while time.time()<deadline:
            req=urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&fields[builds]=version,uploadedDate,processingState&sort=-uploadedDate&limit=8",
              headers={"Authorization":f"Bearer {token()}"},
            )
            with urllib.request.urlopen(req, timeout=60) as resp:
              data=json.load(resp)
            builds=[{"buildNumber":b["attributes"]["version"],"processingState":b["attributes"]["processingState"],"uploadedDate":b["attributes"]["uploadedDate"]} for b in data.get("data") or []]
            print("ASC", json.dumps(builds), flush=True)
            if any(str(b["buildNumber"]).isdigit() and int(b["buildNumber"])>=75 for b in builds):
              print("SUCCESS_ASC_HAS_75_PLUS", flush=True)
              raise SystemExit(0)
            time.sleep(45)
          print("TIMEOUT after altool upload: ASC still missing build >= 75", flush=True)
          raise SystemExit(1)
          PY